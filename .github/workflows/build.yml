name: Test call
run-name: Test call to read PR context

on:
  workflow_call:
    inputs:
      git_ref:
        description: Test
        type: string
        required: true
permissions:
  id-token: write
  contents: write
  packages: write
  pull-requests: write
jobs:
  debug:
    name: Debug inputs
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        run: |
          echo "pr_head_sha: ${{ github.event.pull_request.head.sha }}"
          echo "pr_number: ${{ github.event.pull_request.number }}"
          echo "pr_id: ${{ github.event.pull_request.id }}"
          echo "git_ref: ${{ inputs.git_ref }}"
          echo "github_ref: ${{ github.event.pull_request.head.ref }}"
