name: ECR Buildx Push Test

on:
  push:
    branches:
      - 'test/**'
      - 'buildx-**'

permissions:
  id-token: write
  contents: write
  packages: write
  pull-requests: read

env:
  GHCR_REGISTRY: ghcr.io
  ECR_REPO: buildx-test

jobs:
  build-and-publish:
    name: Build and Publish Multi-Arch Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repository Code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: "${{ env.GHCR_REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '>=1.21.0'

      - name: Build and push multi-arch image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: cmd/hello
          file: cmd/hello/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/buildx-test:test-${{ github.sha }}
