name: ECR Buildx Push Test

on:
  push:
    branches:
      - 'test/**'
      - 'buildx-**'

permissions:
  id-token: write
  contents: write
  packages: write
  pull-requests: read

env:
  GHCR_REGISTRY: ghcr.io
  ECR_REPO: buildx-test

jobs:
  build-and-publish:
    name: Build and Publish Multi-Arch Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repository Code
        uses: actions/checkout@v5

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_SECRET }}
          tags: tag:dmx-prod

      - name: Get secrets from Vault
        id: secrets
        uses: hashicorp/vault-action@v4
        with:
          method: jwt
          path: "jwt/github-action"
          url: "https://vault.ops.vungle.io"
          role: "jwt-github-action-vm"
          exportToken: true
          exportEnv: false
          secrets: |
            cicd/data/vm/github-action DOCKERHUB_TOKEN;
            cicd/data/vm/github-action DOCKERHUB_USERNAME;

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Disconnect Tailscale
        if: always()
        run: sudo -E tailscale down

      - name: Assume github action role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "arn:aws:iam::320005014399:role/github-actions-ecr"
          aws-region: us-east-1
          mask-aws-account-id: false
          role-session-name: github-actions-ecr

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPO }} \
            || aws ecr create-repository --repository-name ${{ env.ECR_REPO }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Login to GHCR
        id: login-ghcr
        uses: docker/login-action@v4
        with:
          registry: "${{ env.GHCR_REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '>=1.21.0'

      - name: Build and push multi-arch image
        run: |
          IMAGE_TAG="test-$(echo ${{ github.sha }} | cut -c1-7)"
          make build PROJECT_IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:${IMAGE_TAG}"
