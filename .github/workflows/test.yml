name: Test wrokflow
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
jobs:
  checkout:
    name: Checkout code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
  call:
    uses: ./.github/workflows/build.yml
    needs: checkout
    with:
      git_ref: ${{ github.event.pull_request.head.ref }}