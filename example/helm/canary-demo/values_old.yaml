# Default values for example.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 10
image:
  repository: 320005014399.dkr.ecr.us-east-1.amazonaws.com/ghcr/vungle/canary-demo
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v1.0.0"
eksEnv: eks-qa-us-east-1b
ticket: placeholder
action: placeholder
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
commonLabels:
  liftoff.io/team: pe
  liftoff.io/service: canaery-demo
  liftoff.io/env: qa
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podAnnotations:
podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}
notifications:
  notifications.argoproj.io/subscribe.on-rollout-aborted.messages: ""
  notifications.argoproj.io/subscribe.on-rollout-updated.messages: ""
  notifications.argoproj.io/subscribe.on-rollout-completed.messages: ""
  notifications.argoproj.io/subscribe.on-scaling-replica-set.messages: ""
  notifications.argoproj.io/subscribe.on-rollout-paused.messages: ""
  notifications.argoproj.io/subscribe.on-analysis-run-error.messages: ""
  notifications.argoproj.io/subscribe.on-analysis-run-failed.messages: ""
  notifications.argoproj.io/subscribe.on-analysis-run-running.messages: ""
canarySteps:
  - setWeight: 10
  - analysis:
      templates:
        - templateName: memory-usage
      args:
        - name: service
          value: canary-demo
        - name: cluster
          value: test
  - setWeight: 50
  - analysis:
      templates:
        - templateName: memory-usage
      args:
        - name: service
          value: canary-demo
        - name: cluster
          value: test
  - setWeight: 100
  - analysis:
      templates:
        - templateName: memory-usage
      args:
        - name: service
          value: canary-demo
        - name: cluster
          value: test
